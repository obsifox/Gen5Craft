name: build-windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25 (matches Minecraft 26.3 javaVersion)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Compile
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $src = Get-ChildItem -Recurse src/main/java, launcher/src/main/java -Filter *.java | ForEach-Object { $_.FullName }
          javac --release 17 -encoding UTF-8 -d out $src
          $test = Get-ChildItem -Recurse src/test/java -Filter *.java | ForEach-Object { $_.FullName }
          javac --release 17 -encoding UTF-8 -cp out -d out-test $test

      - name: Run tests
        shell: pwsh
        run: java -cp "out;out-test" com.gen5craft.TestMain

      - name: Package runnable jars (client + launcher)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          @"
          Main-Class: com.gen5craft.Main
          Implementation-Title: Gen5Craft
          Implementation-Version: 1.2.0
          "@ | Set-Content -Encoding ascii manifest.mf
          jar cfm dist/Gen5Craft.jar manifest.mf -C out com/gen5craft/Main.class -C out com/gen5craft/core -C out com/gen5craft/ui -C out com/gen5craft/render -C out com/gen5craft/net
          @"
          Main-Class: com.gen5craft.launcher.LauncherMain
          Implementation-Title: Gen5Craft Launcher
          Implementation-Version: 1.2.0
          "@ | Set-Content -Encoding ascii launcher-manifest.mf
          jar cfm dist/Gen5Craft-Launcher.jar launcher-manifest.mf -C out com/gen5craft/launcher

      - name: Validate jar layout (packaging gate)
        shell: pwsh
        run: |
          $client = jar tf dist/Gen5Craft.jar
          if ($client -notcontains "com/gen5craft/Main.class") { throw "Client jar missing Main" }
          if ($client -notcontains "com/gen5craft/core/Gen5Versions.class") { throw "Client jar layout invalid: core package missing" }
          if ($client -notcontains "com/gen5craft/render/SoftwareRenderer.class") { throw "Client jar layout invalid: render package missing" }
          if ($client -notcontains "com/gen5craft/net/LoginSession.class") { throw "Client jar layout invalid: net package missing" }
          if ($client -notcontains "com/gen5craft/core/ChunkDataDecoder.class") { throw "Client jar layout invalid: Phase 7 chunk decoder missing" }
          if ($client -notcontains "com/gen5craft/core/ChunkColumn.class") { throw "Client jar layout invalid: Phase 7 chunk column missing" }
          $launcher = jar tf dist/Gen5Craft-Launcher.jar
          if ($launcher -notcontains "com/gen5craft/launcher/LauncherMain.class") { throw "Launcher jar layout invalid" }
          javap -classpath dist/Gen5Craft.jar com.gen5craft.Main | Out-Null
          javap -classpath dist/Gen5Craft-Launcher.jar com.gen5craft.launcher.LauncherMain | Out-Null
          Write-Host "Jar layout OK"

      - name: Windows app images (jpackage)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force in-client, in-launcher | Out-Null
          Copy-Item dist/Gen5Craft.jar in-client/
          Copy-Item dist/Gen5Craft-Launcher.jar in-launcher/
          Copy-Item installer/Install-Gen5Craft.ps1 dist/
          jpackage --type app-image --name Gen5Craft --dest dist --input in-client --main-jar Gen5Craft.jar --main-class com.gen5craft.Main --java-options "-Xmx2G"
          Compress-Archive -Path dist/Gen5Craft -DestinationPath dist/Gen5Craft-windows.zip -Force
          jpackage --type app-image --name Gen5CraftLauncher --dest dist --input in-launcher --main-jar Gen5Craft-Launcher.jar --main-class com.gen5craft.launcher.LauncherMain --java-options "-Xmx512M"
          Compress-Archive -Path dist/Gen5CraftLauncher -DestinationPath dist/Gen5Craft-Launcher-windows.zip -Force

      - name: Download manifest for the client jar
        shell: pwsh
        run: |
          $jarHash = (Get-FileHash dist/Gen5Craft.jar -Algorithm SHA256).Hash.ToLower()
          $zipHash = (Get-FileHash dist/Gen5Craft-windows.zip -Algorithm SHA256).Hash.ToLower()
          $launcherJarHash = (Get-FileHash dist/Gen5Craft-Launcher.jar -Algorithm SHA256).Hash.ToLower()
          $launcherZipHash = (Get-FileHash dist/Gen5Craft-Launcher-windows.zip -Algorithm SHA256).Hash.ToLower()
          $installerHash = (Get-FileHash dist/Install-Gen5Craft.ps1 -Algorithm SHA256).Hash.ToLower()
          $manifest = [ordered]@{
            name = "Gen5Craft"; version = "1.2.0"; platform = "windows";
            mainClass = "com.gen5craft.Main";
            game = [ordered]@{ generation = 5; range = "1.20.5-26.3"; latestData = "26.3";
              mojangManifest = "https://piston-meta.mojang.com/mc/game/version_manifest_v2.json" }
            files = @(
              [ordered]@{ name = "Gen5Craft.jar"; sha256 = $jarHash },
              [ordered]@{ name = "Gen5Craft-windows.zip"; sha256 = $zipHash },
              [ordered]@{ name = "Gen5Craft-Launcher.jar"; sha256 = $launcherJarHash },
              [ordered]@{ name = "Gen5Craft-Launcher-windows.zip"; sha256 = $launcherZipHash },
              [ordered]@{ name = "Install-Gen5Craft.ps1"; sha256 = $installerHash }
            )
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 dist/gen5craft-manifest.json
          Get-Content dist/gen5craft-manifest.json

      # NOTE: Actions artifact storage quota for this account is full, so the
      # downloadable build is published as (draft) Release assets instead.
      - name: Publish downloadable release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: Gen5Craft 1.2.0
          draft: true
          files: |
            dist/Gen5Craft.jar
            dist/Gen5Craft-windows.zip
            dist/Gen5Craft-Launcher.jar
            dist/Gen5Craft-Launcher-windows.zip
            dist/gen5craft-manifest.json
            dist/Install-Gen5Craft.ps1
